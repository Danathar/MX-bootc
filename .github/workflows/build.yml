---
name: Build container image
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_run:
    workflows: [Build bootc base image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "MX Linux 25.x KDE-style image built on Debian bootc"
  IMAGE_KEYWORDS: "bootc,debian,mx-linux,kde,plasma"
  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BASE_TAG: "v2026.2-cd2594a759f3"
  BASE_IMAGE: "ghcr.io/${{ github.repository_owner }}/mx-bootc-base:v2026.2-cd2594a759f3"
  PR_TAG: "pr-${{ github.sha }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "BASE_IMAGE=${BASE_IMAGE,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # This is optional, but if you see that your builds are way too big for the runners,
      # you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build PR base image
        if: github.event_name == 'pull_request'
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b  # v3.0.2
        with:
          containerfiles: Containerfile.base
          image: localhost/mx-bootc-base
          tags: ${{ env.BASE_TAG }}
          oci: false

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Capture previous package manifest
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/mx-bootc-manifest
          previous="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          if podman pull "${previous}" >/dev/null 2>&1; then
            podman run --rm --entrypoint /bin/cat "${previous}" \
              /usr/share/mx-bootc-kde/desktop-packages.txt \
              > /tmp/mx-bootc-manifest/previous.txt
          else
            echo 'No previous published image available.' > /tmp/mx-bootc-manifest/previous.txt
          fi

      # Image metadata for https://artifacthub.io/ - This is optional but is highly
      # recommended so we all can get a index of all the custom images.
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ env.PR_TAG }},enable=${{ github.event_name == 'pull_request' }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b  # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && format('localhost/mx-bootc-base:{0}', env.BASE_TAG) || env.BASE_IMAGE }}

      - name: Record package manifest and diff
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/mx-bootc-manifest
          package_tag="${DEFAULT_TAG}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            package_tag="${PR_TAG}"
          fi
          podman run --rm --entrypoint /bin/cat \
            "localhost/${IMAGE_NAME}:${package_tag}" \
            /usr/share/mx-bootc-kde/desktop-packages.txt \
            > /tmp/mx-bootc-manifest/current.txt
          diff_status=0
          diff -u /tmp/mx-bootc-manifest/previous.txt /tmp/mx-bootc-manifest/current.txt \
            > /tmp/mx-bootc-manifest/diff.txt || diff_status=$?
          {
            echo '### Package manifest diff'
            if [[ "${diff_status}" -eq 0 ]]; then
              echo 'No package changes compared with the previous published image.'
            elif [[ "${diff_status}" -eq 1 ]]; then
              echo '```diff'
              cat /tmp/mx-bootc-manifest/diff.txt
              echo '```'
            else
              echo 'Manifest comparison failed; see the uploaded artifact.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload package manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-manifest
          path: /tmp/mx-bootc-manifest
          if-no-files-found: warn

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710  # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     # Rechunk strips out all the labels during build; reapply them with a newline separator.
      #     labels: ${{ steps.metadata.outputs.labels }}

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # Pull requests from this repository publish an isolated commit-tagged image for validation.
      # Fork pull requests remain unable to publish packages with the read-only token.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        if: >-
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name != 'pull_request' &&
          (github.event_name == 'workflow_run' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        if: >-
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name != 'pull_request' &&
          (github.event_name == 'workflow_run' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name == 'workflow_run' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name == 'workflow_run' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.push.outputs.digest }}"

          if [[ -z "${DIGEST}" ]]; then
            echo "::warning::No image digest from push step; skipping signing."
            exit 0
          fi

          if [[ "${DIGEST}" != sha256:* ]]; then
            DIGEST="sha256:${DIGEST}"
          fi
          IMAGE_REF="${IMAGE_FULL}@${DIGEST}"

          key_file="$(mktemp)"
          cleanup() {
            rm -f "${key_file}"
          }
          trap cleanup EXIT

          load_signing_key() {
            local raw_key="$1"

            # Raw PEM with real newlines
            if printf '%s\n' "${raw_key}" > "${key_file}" && grep -q "BEGIN .*PRIVATE KEY" "${key_file}"; then
              return 0
            fi

            # PEM stored with escaped newlines (\n)
            if printf '%b\n' "${raw_key}" > "${key_file}" && grep -q "BEGIN .*PRIVATE KEY" "${key_file}"; then
              return 0
            fi

            # Base64-encoded PEM
            if printf '%s' "${raw_key}" | base64 -d > "${key_file}" 2>/dev/null && grep -q "BEGIN .*PRIVATE KEY" "${key_file}"; then
              return 0
            fi

            return 1
          }

          if [[ -n "${COSIGN_PRIVATE_KEY:-}" ]]; then
            if ! load_signing_key "${COSIGN_PRIVATE_KEY}"; then
              echo "::error::SIGNING_SECRET is not a valid cosign private key (PEM, escaped PEM, or base64 PEM)."
              exit 1
            fi
            cosign sign -y --key "${key_file}" "${IMAGE_REF}"
          else
            echo "::notice::SIGNING_SECRET not set; using keyless signing."
            cosign sign -y "${IMAGE_REF}"
          fi
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  boot_smoke:
    name: Boot smoke test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build_push
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read
    with:
      image_ref: ghcr.io/${{ github.repository }}:pr-${{ github.sha }}

  disk_images:
    name: Build disk images
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build_push
    uses: ./.github/workflows/build-disk.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      image_ref: ghcr.io/${{ github.repository }}:pr-${{ github.sha }}
